<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>멜론 매거진 시네마</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Bebas+Neue&display=swap">
<style>
  :root { --green:#00cd3c; --gold:#e8b45a; --red:#b3122e; --ink:#0c0b0c; --paper:#f4efe8; --muted:#9a9096; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#070607; color:var(--paper);
    font-family:'Noto Sans KR', system-ui, sans-serif; -webkit-user-select:none; user-select:none; }
  canvas { display:block; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
  button { font:inherit; cursor:pointer; border:0; border-radius:999px; }

  /* ----- 입장 (티켓) ----- */
  #intro { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:30; padding:16px;
    background:radial-gradient(ellipse at 50% 30%, rgba(90,10,25,.92), rgba(5,4,5,.98) 70%); transition:opacity .6s; overflow-y:auto; }
  #intro.hide { opacity:0; pointer-events:none; }
  .ticket { width:min(440px, 100%); background:#f4efe8; color:#1a1416; border-radius:18px; position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.6); overflow:hidden; }
  .ticket .top { padding:26px 28px 20px; background:linear-gradient(135deg, #1a0d10, #3a0d18); color:var(--paper); }
  .ticket .eyebrow { font-family:'Bebas Neue', sans-serif; letter-spacing:4px; color:var(--gold); font-size:18px; margin:0; }
  .ticket h1 { font-size:30px; font-weight:900; margin:4px 0 6px; }
  .ticket .sub { margin:0; color:#d9c9cd; font-size:14px; }
  .ticket .meta { margin:8px 0 0; color:#a5939a; font-size:12px; }
  .perf { height:0; border-top:2px dashed #cdbfc3; margin:0 18px; position:relative; }
  .perf::before, .perf::after { content:''; position:absolute; top:-13px; width:24px; height:24px; border-radius:50%; background:#2a0910; }
  .perf::before { left:-30px; } .perf::after { right:-30px; }
  .ticket .bottom { padding:20px 28px 24px; }
  .ticket label { display:block; font-size:12px; font-weight:700; color:#6b5c62; margin:0 0 6px; letter-spacing:1px; }
  #nick { width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:10px; border:1px solid #cdbfc3; background:#fff; color:#1a1416; }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 16px; }
  .swatches button { width:30px; height:30px; border:3px solid transparent; box-shadow:0 0 0 1px rgba(0,0,0,.15); }
  .swatches button.on { border-color:#1a1416; }
  .keys { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12px; color:#5b4d53; margin:0 0 18px; }
  .keys b { color:#1a1416; font-weight:700; }
  #enter { width:100%; background:var(--red); color:#fff; padding:13px; font-size:16px; font-weight:700; border-radius:12px; }
  #enter:disabled { opacity:.5; cursor:wait; }
  #progress { margin-top:10px; font-size:12px; color:#8a7b81; min-height:16px; text-align:center; }

  /* ----- HUD ----- */
  #hud { position:fixed; top:14px; right:14px; display:flex; gap:8px; z-index:10; flex-wrap:wrap; justify-content:flex-end; max-width:70vw; }
  #hud button, #online { background:rgba(12,10,11,.72); color:var(--paper); padding:9px 15px; font-size:13px;
    border:1px solid rgba(255,255,255,.15); backdrop-filter:blur(6px); }
  #hud button.on { background:var(--red); border-color:var(--red); }
  #online { position:fixed; top:58px; right:14px; z-index:10; border-radius:999px; font-size:12px; }
  #online i { display:inline-block; width:8px; height:8px; border-radius:50%; background:#777; margin-right:6px; }
  #online.live i { background:var(--green); box-shadow:0 0 8px var(--green); }
  #title-tag { position:fixed; top:16px; left:16px; z-index:10; font-family:'Bebas Neue', sans-serif; font-size:24px; letter-spacing:2px;
    text-shadow:0 2px 8px rgba(0,0,0,.7); }
  #title-tag span { color:var(--gold); }

  #label { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:10; padding:12px 20px;
    border-radius:14px; background:rgba(12,10,11,.82); backdrop-filter:blur(6px); font-size:14px; border:1px solid rgba(232,180,90,.35);
    text-align:center; opacity:0; transition:opacity .3s; pointer-events:none; width:max-content; max-width:calc(100% - 32px); }
  #label.show { opacity:1; pointer-events:auto; }
  #label .no { font-family:'Bebas Neue', sans-serif; color:var(--gold); letter-spacing:2px; font-size:16px; }
  #label b { display:block; font-size:15px; margin:2px 0 4px; }
  #label small { color:#b0a4a9; font-size:12px; }
  #label button { background:var(--red); color:#fff; padding:7px 16px; font-size:13px; margin-top:8px; }

  #emotes { position:fixed; right:14px; bottom:14px; z-index:10; display:flex; gap:6px; }
  #emotes button { width:44px; height:44px; font-size:20px; background:rgba(12,10,11,.72); border:1px solid rgba(255,255,255,.15); }
  #emotes button:active { transform:scale(.9); }

  /* ----- 상영 안내 (기사 읽기) ----- */
  #reader { position:fixed; inset:0; z-index:20; display:none; background:rgba(3,2,3,.9); }
  #reader.open { display:block; }
  #reader .sheet { position:absolute; inset:0; overflow-y:auto; -webkit-user-select:text; user-select:text; }
  #reader article { width:min(780px, 100%); margin:0 auto; background:#121012; min-height:100%; padding:0 0 60px;
    box-shadow:0 0 80px rgba(0,0,0,.7); }
  #reader .hero { position:relative; }
  #reader .hero img { width:100%; display:block; max-height:64vh; object-fit:cover; background:#222; }
  #reader .hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 55%, #121012); }
  #reader .head { padding:0 32px 8px; margin-top:-70px; position:relative; z-index:1; }
  #reader .no { font-family:'Bebas Neue', sans-serif; font-size:22px; letter-spacing:3px; color:var(--gold); }
  #reader .no em { font-style:normal; color:#fff; background:var(--red); font-size:13px; letter-spacing:1px; padding:2px 8px; border-radius:4px; margin-left:8px; vertical-align:3px; font-family:'Noto Sans KR'; font-weight:700; }
  #reader h1 { font-size:30px; line-height:1.35; margin:6px 0 12px; font-weight:900; word-break:keep-all; color:#fff; }
  #reader .facts { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:#b5a9ae; border-top:1px solid #2c272a; border-bottom:1px solid #2c272a; padding:10px 0; }
  #reader .facts b { color:#fff; font-weight:500; margin-left:4px; }
  #reader .rate { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--green); color:#fff; font-size:11px; font-weight:900; }
  #reader .body { padding:8px 32px 0; }
  #reader h2 { font-size:20px; line-height:1.45; margin:36px 0 12px; font-weight:700; word-break:keep-all; color:#fff; }
  #reader h2 .tag { display:inline-block; border:1px solid var(--gold); color:var(--gold); font-size:11px; font-weight:700;
    letter-spacing:1px; padding:2px 8px; border-radius:4px; margin-right:8px; vertical-align:3px; }
  #reader h2.q { font-size:17px; color:var(--gold); margin-top:28px; }
  #reader p { font-size:16px; line-height:1.85; white-space:pre-wrap; word-break:keep-all; margin:0 0 16px; color:#d8d0d3; }
  #reader figure { margin:18px -32px; }
  #reader figure img { width:100%; display:block; background:#1d1a1c; min-height:120px; }
  #reader .album img { width:120px; height:120px; border-radius:8px; margin:8px 0 18px; }
  #reader .src { margin:36px 32px 0; padding-top:20px; border-top:1px solid #2c272a; display:flex;
    justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  #reader .src a { color:#fff; background:var(--green); padding:9px 18px; border-radius:999px; text-decoration:none; font-weight:700; }
  #reader .ctrl { position:fixed; z-index:21; background:rgba(12,10,11,.85); color:#fff; width:46px; height:46px; font-size:20px; border:1px solid rgba(255,255,255,.15); }
  #reader .close { top:16px; right:16px; }
  #reader .prev { left:16px; top:50%; transform:translateY(-50%); }
  #reader .next { right:16px; top:50%; transform:translateY(-50%); }

  #pad { position:fixed; left:14px; bottom:14px; z-index:10; display:none; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(2,52px); gap:6px; }
  #pad button { border-radius:12px; background:rgba(12,10,11,.6); color:#fff; font-size:20px; border:1px solid rgba(255,255,255,.15); }
  @media (pointer:coarse) { #pad { display:grid; } #label { bottom:140px; } #emotes { bottom:76px; flex-direction:column; } }
  @media (max-width:820px) {
    #reader .prev, #reader .next { top:auto; bottom:16px; transform:none; }
    #reader .head, #reader .body { padding-left:18px; padding-right:18px; }
    #reader figure { margin-left:-18px; margin-right:-18px; }
    #reader .src { margin-left:18px; margin-right:18px; }
    #reader h1 { font-size:24px; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="intro">
  <div class="ticket">
    <div class="top">
      <p class="eyebrow">MELON MAGAZINE CINEMA · ADMIT ONE</p>
      <h1>매거진 시네마</h1>
      <p class="sub">상영관마다 걸린 멜론 매거진 이야기를 골라 입장하세요</p>
      <p class="meta" id="ex-meta"></p>
    </div>
    <div class="perf"></div>
    <div class="bottom">
      <label for="nick">관객 이름 (다른 관객에게 보여요)</label>
      <input id="nick" maxlength="12" autocomplete="nickname" placeholder="이름을 적어 주세요">
      <div class="swatches" id="swatches"></div>
      <div class="keys">
        <b>W A S D / ↑ ↓</b><span>걷기 (Shift: 빠르게) · ← → 돌기</span>
        <b>드래그</b><span>둘러보기</span>
        <b>상영관 클릭 / Enter</b><span>입장해서 사진·글 보기</span>
        <b>V</b><span>1인칭 ↔ 3인칭 시점</span>
        <b>1 2 3 4</b><span>👏 ❤️ 😂 🍿 리액션 보내기</span>
      </div>
      <button id="enter" disabled>상영작 불러오는 중…</button>
      <div id="progress"></div>
    </div>
  </div>
</div>

<div id="title-tag"><span>MELON</span> MAGAZINE CINEMA</div>
<div id="hud">
  <button id="btn-view">👁 3인칭</button>
  <button id="btn-tour">▶ 자동 관람</button>
  <button id="btn-home">로비로</button>
</div>
<div id="online"><i></i><span>연결 중…</span></div>
<div id="label"></div>
<div id="emotes">
  <button data-e="👏" title="박수 (1)">👏</button><button data-e="❤️" title="하트 (2)">❤️</button>
  <button data-e="😂" title="웃음 (3)">😂</button><button data-e="🍿" title="팝콘 (4)">🍿</button>
</div>

<div id="reader">
  <div class="sheet"><article></article></div>
  <button class="ctrl close" aria-label="상영관 나가기">✕</button>
  <button class="ctrl prev" aria-label="이전 상영관">‹</button>
  <button class="ctrl next" aria-label="다음 상영관">›</button>
</div>

<div id="pad">
  <span></span><button data-k="fwd">▲</button><span></span>
  <button data-k="left">↺</button><button data-k="back">▼</button><button data-k="right">↻</button>
</div>

<script type="module" src="space.js"></script>
</body>
</html>
